<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Show Spot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Admin Dashboard</h2>
    <div class="list-group">
        <a th:href="@{/admin/movies/add}" class="list-group-item list-group-item-action">Add Movie</a>
        <a th:href="@{/admin/shows/add}" class="list-group-item list-group-item-action">Add Show</a>
        <a th:href="@{/admin/bookings}" class="list-group-item list-group-item-action">View All Bookings</a>
    </div>
    <hr>
    <h4>Movies</h4>
    <ul class="list-group mb-3">
        <li class="list-group-item" th:each="movie : ${movies}">
            <span th:text="${movie.title}"></span>
            <a th:href="@{'/admin/movies/' + ${movie.id} + '/edit'}" class="btn btn-sm btn-warning ms-2">Edit</a>
            <form th:action="@{'/admin/movies/' + ${movie.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-sm btn-danger ms-1">Delete</button>
            </form>
        </li>
    </ul>
    <h4>Shows</h4>
    <ul class="list-group">
        <li class="list-group-item" th:each="show : ${shows}">
            <span th:text="${show.movie.title}"></span> - <span th:text="${show.showTime}"></span>
            <a th:href="@{'/admin/shows/' + ${show.id} + '/edit'}" class="btn btn-sm btn-warning ms-2">Edit</a>
            <form th:action="@{'/admin/shows/' + ${show.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-sm btn-danger ms-1">Delete</button>
            </form>
        </li>
    </ul>
</div>
</body>
</html>
