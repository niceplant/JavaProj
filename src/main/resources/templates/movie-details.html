<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${movie.title} + ' - Show Spot'"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <img th:src="${movie.posterUrl}" class="img-fluid rounded" th:alt="${movie.title}">
        </div>
        <div class="col-md-8">
            <h2 th:text="${movie.title}"></h2>
            <p th:text="${movie.description}"></p>
            <ul class="list-group mb-3">
                <li class="list-group-item"><strong>Genre:</strong> <span th:text="${movie.genre}"></span></li>
                <li class="list-group-item"><strong>Duration:</strong> <span th:text="${movie.durationMinutes}"></span> min</li>
                <li class="list-group-item"><strong>Release Date:</strong> <span th:text="${movie.releaseDate}"></span></li>
            </ul>
            <h4>Showtimes</h4>
            <ul class="list-group">
                <li class="list-group-item" th:each="show : ${shows}">
                    <span th:text="${show.showTime}"></span> - 
                    <a th:href="@{'/shows/' + ${show.id} + '/book'}" class="btn btn-success btn-sm">Book Now</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
