<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Show Form - Show Spot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${show.id == null ? 'Add Show' : 'Edit Show'}"></h2>
    <form th:action="@{${show.id == null ? '/admin/shows/add' : '/admin/shows/' + ${show.id} + '/edit'}}" th:object="${show}" method="post">
        <div class="mb-3">
            <label for="movie" class="form-label">Movie</label>
            <select class="form-select" id="movie" th:field="*{movie}" required>
                <option th:each="movie : ${movies}" th:value="${movie}" th:text="${movie.title}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="showTime" class="form-label">Show Time</label>
            <input type="datetime-local" class="form-control" id="showTime" th:field="*{showTime}" required>
        </div>
        <div class="mb-3">
            <label for="auditorium" class="form-label">Auditorium</label>
            <input type="text" class="form-control" id="auditorium" th:field="*{auditorium}" required>
        </div>
        <div class="mb-3">
            <label for="totalSeats" class="form-label">Total Seats</label>
            <input type="number" class="form-control" id="totalSeats" th:field="*{totalSeats}" required>
        </div>
        <div class="mb-3">
            <label for="availableSeats" class="form-label">Available Seats</label>
            <input type="number" class="form-control" id="availableSeats" th:field="*{availableSeats}" required>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/admin}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
