<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Seats - Show Spot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Select Seats</h2>
    <div class="mb-3">
        <strong>Show Time:</strong> <span th:text="${show.showTime}"></span><br>
        <strong>Auditorium:</strong> <span th:text="${show.auditorium}"></span><br>
        <strong>Available Seats:</strong> <span th:text="${show.availableSeats}"></span>
    </div>
    <form th:action="@{'/shows/' + ${show.id} + '/book'}" method="post">
        <div class="mb-3">
            <label for="seats" class="form-label">Seat Numbers (comma separated)</label>
            <input type="text" class="form-control" id="seats" name="seats" required>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price per Ticket</label>
            <input type="number" class="form-control" id="price" name="price" required>
        </div>
        <button type="submit" class="btn btn-primary">Confirm Booking</button>
    </form>
</div>
</body>
</html>
