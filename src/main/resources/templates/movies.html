<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Browse Movies - Show Spot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Now Showing</h2>
    <div class="row">
        <div class="col-md-4 mb-4" th:each="movie : ${movies}">
            <div class="card h-100">
                <img th:src="${movie.posterUrl}" class="card-img-top" th:alt="${movie.title}" style="height:300px;object-fit:cover;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${movie.title}"></h5>
                    <p class="card-text" th:text="${movie.description}"></p>
                    <a th:href="@{'/movies/' + ${movie.id}}" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
