<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmation - Show Spot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="alert alert-success">
        <h4 class="alert-heading">Booking Confirmed!</h4>
        <p>Your booking is successful. Booking ID: <span th:text="${booking.id}"></span></p>
        <hr>
        <a th:href="@{'/bookings/' + ${booking.id} + '/pay'}" class="btn btn-success">Proceed to Payment</a>
    </div>
</div>
</body>
</html>
