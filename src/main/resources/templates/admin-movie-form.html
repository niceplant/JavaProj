<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movie Form - Show Spot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${movie.id == null ? 'Add Movie' : 'Edit Movie'}"></h2>
    <form th:action="@{${movie.id == null ? '/admin/movies/add' : '/admin/movies/' + ${movie.id} + '/edit'}}" th:object="${movie}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" th:field="*{description}" required></textarea>
        </div>
        <div class="mb-3">
            <label for="durationMinutes" class="form-label">Duration (minutes)</label>
            <input type="number" class="form-control" id="durationMinutes" th:field="*{durationMinutes}" required>
        </div>
        <div class="mb-3">
            <label for="genre" class="form-label">Genre</label>
            <input type="text" class="form-control" id="genre" th:field="*{genre}" required>
        </div>
        <div class="mb-3">
            <label for="releaseDate" class="form-label">Release Date</label>
            <input type="date" class="form-control" id="releaseDate" th:field="*{releaseDate}" required>
        </div>
        <div class="mb-3">
            <label for="posterUrl" class="form-label">Poster URL</label>
            <input type="text" class="form-control" id="posterUrl" th:field="*{posterUrl}" required>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/admin}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
